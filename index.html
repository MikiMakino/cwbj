<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CWBJ FAQ</title>
  <style>

    * { box-sizing: border-box; }
    html, body { background: #ffffff; }
    body {
      margin: 0;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #111111; }
    .page {
      max-width: 780px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    .masthead {
      padding-bottom: 24px;
      border-bottom: 1px solid #d9d9d9;
    }
    h1.title {
      margin: 0;
      font-size: clamp(28px, 5vw, 38px);
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .tagline {
      margin: 8px 0 0;
      font-size: 15px;
      color: #444444;
    }
    .lede {
      margin: 14px 0 0;
      max-width: 42em;
      color: #555555;
      font-size: 14px;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #ffffff;
      padding: 20px 0 16px;
      border-bottom: 1px solid #eeeeee;
    }
    .search { position: relative; display: block; }
    .search input {
      width: 100%;
      font: inherit;
      font-size: 14px;
      color: #111111;
      background: #ffffff;
      border: 1px solid #bdbdbd;
      border-radius: 4px;
      padding: 11px 12px 11px 38px;
      outline: none;
    }
    .search input:focus-visible { border-color: #111111; outline: 1px solid #111111; }
    .search input::placeholder { color: #777777; }
    .search svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: #666666;
      pointer-events: none;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .chip {
      font: inherit;
      font-size: 13px;
      color: #333333;
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .chip:hover { border-color: #777777; }
    .chip[aria-pressed="true"] {
      color: #111111;
      background: #f2f2f2;
      border-color: #777777;
      font-weight: 700;
    }
    .chip:focus-visible, summary:focus-visible, .cta:focus-visible {
      outline: 2px solid #111111;
      outline-offset: 2px;
    }
    .result-count {
      margin: 10px 0 0;
      font-size: 12px;
      color: #666666;
    }
    .category-group { margin-top: 34px; }
    .category-heading {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
    }
    .category-heading .dot { display: none; }
    .entry-list { border-top: 1px solid #cccccc; }
    details.entry { border-bottom: 1px solid #dddddd; }
    details.entry summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 2px;
    }
    details.entry summary::-webkit-details-marker { display: none; }
    .q-mark {
      flex: none;
      width: 24px;
      font-size: 13px;
      font-weight: 700;
      color: #333333;
      padding-top: 1px;
    }
    .q-text {
      flex: 1;
      font-weight: 600;
      font-size: 15px;
    }
    .chevron {
      flex: none;
      width: 16px;
      height: 16px;
      margin-top: 4px;
      stroke: #666666;
      transition: transform 0.18s ease;
    }
    details.entry[open] .chevron { transform: rotate(180deg); }
    .a-body {
      display: flex;
      gap: 12px;
      padding: 0 2px 18px;
    }
    .a-mark {
      flex: none;
      width: 24px;
      font-size: 13px;
      font-weight: 700;
      color: #333333;
    }
    .a-text {
      flex: 1;
      color: #444444;
      font-size: 14px;
      max-width: 44em;
    }
    .a-text p { margin: 0 0 10px; }
    .a-text p:last-child { margin-bottom: 0; }
    .a-text ul { margin: 0 0 10px; padding-left: 20px; }
    .a-text ul:last-child { margin-bottom: 0; }
    .a-text code {
      background: #f2f2f2;
      border-radius: 3px;
      padding: 0 4px;
      font-size: 13px;
    }
    mark { background: #eeeeee; color: #111111; padding: 0 0.1em; }
    .entry.is-hidden, .category-group.is-hidden { display: none; }
    .empty-state {
      margin-top: 28px;
      padding: 20px 0;
      text-align: center;
      color: #666666;
      font-size: 14px;
      display: none;
    }
    .empty-state.is-visible { display: block; }
    .status {
      margin-top: 28px;
      padding: 20px 0;
      text-align: center;
      color: #666666;
      font-size: 14px;
    }
    .cta-block {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #cccccc;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .cta-block h2 {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 700;
    }
    .cta-block p { margin: 0; font-size: 13px; color: #555555; }
    .cta {
      font: inherit;
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
      background: #111111;
      border: 1px solid #111111;
      border-radius: 4px;
      padding: 10px 14px;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .cta[aria-disabled="true"] { background: #777777; border-color: #777777; }
    .fine-print {
      margin-top: 24px;
      font-size: 12px;
      color: #666666;
    }
    .fine-print a { color: #555555; }
    @media (prefers-reduced-motion: reduce) { .chevron { transition: none; } }
    @media (max-width: 520px) {
      .page { padding: 32px 18px 48px; }
      .toolbar { padding-top: 14px; }
      .cta-block { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="page">

  <header class="masthead">
    <h1 class="title">CWBJ FAQ</h1>
    <p class="tagline">Code;Without Barriers in Japan｜よくある質問・相談</p>
    <p class="lede">寄せられた質問と相談をまとめています。運営内で内容を確認し、公開に適したものだけを掲載しています。</p>
  </header>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="キーワードで検索(例: 個人情報、削除、GitHub)" autocomplete="off">
    </label>
    <div class="chips" id="chipRow">
      <button class="chip" type="button" data-category="all" aria-pressed="true">すべて</button>
    </div>
    <p class="result-count" id="resultCount" aria-live="polite">読み込み中...</p>
  </div>

  <!-- Q&Aの中身は data/faq.json を読み込んで描画する。HTMLに直接書き足さないこと。 -->
  <main id="results" aria-busy="true">

    <p class="status" id="status" role="status">Q&amp;Aを読み込んでいます...</p>

    <noscript>
      <p class="status">このページはJavaScriptでQ&amp;Aを読み込みます。JavaScriptを有効にするか、<a href="data/faq.json">データファイル</a>を直接ご覧ください。</p>
    </noscript>

    <p class="empty-state" id="emptyState">該当する質問が見つかりませんでした。キーワードを変えて再度お試しください。</p>

  </main>

  <div class="cta-block">
    <div>
      <h2>探している答えが見つかりませんでしたか?</h2>
      <p>質問・相談は匿名で送ることができます。個人情報は公開前にすべて取り除きます。</p>
    </div>
    <a class="cta" id="askLink" href="#" aria-disabled="true">質問・相談を送る</a>
  </div>

  <p class="fine-print">最終更新: <span id="lastUpdated">-</span> ・ 公開中のQ&amp;A <span id="totalCount">-</span>件を表示しています ・ <a href="flow.html">運用フローを見る</a></p>

</div>

<script>
  (function () {
    var CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

    var searchInput = document.getElementById("searchInput");
    var chipRow = document.getElementById("chipRow");
    var results = document.getElementById("results");
    var statusEl = document.getElementById("status");
    var resultCount = document.getElementById("resultCount");
    var emptyState = document.getElementById("emptyState");
    var lastUpdated = document.getElementById("lastUpdated");
    var totalCount = document.getElementById("totalCount");
    var askLink = document.getElementById("askLink");

    var groups = [];
    var totalEntries = 0;
    var activeCategory = "all";

    function formatDate(iso) {
      if (!iso) return "-";
      var date = new Date(iso);
      if (isNaN(date.getTime())) return "-";
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo", year: "numeric", month: "long", day: "numeric"
      }).format(date);
    }

    function buildEntry(entry) {
      var details = document.createElement("details");
      details.className = "entry";
      details.id = "q-" + entry.id;

      var summary = document.createElement("summary");
      var qMark = document.createElement("span");
      qMark.className = "q-mark";
      qMark.textContent = "Q";
      var qText = document.createElement("span");
      qText.className = "q-text";
      qText.textContent = entry.question;
      summary.appendChild(qMark);
      summary.appendChild(qText);
      summary.insertAdjacentHTML("beforeend", CHEVRON);

      var body = document.createElement("div");
      body.className = "a-body";
      var aMark = document.createElement("span");
      aMark.className = "a-mark";
      aMark.textContent = "A";
      var aText = document.createElement("div");
      aText.className = "a-text";
      // answerHtml は scripts/build-data.mjs がエスケープした上で組み立てたHTML。
      aText.innerHTML = entry.answerHtml;
      body.appendChild(aMark);
      body.appendChild(aText);

      details.appendChild(summary);
      details.appendChild(body);
      // 検索対象は質問文と回答本文だけ。"Q" / "A" の記号まで拾うと1文字検索が全件に当たる。
      details.dataset.searchText = (entry.question + " " + aText.textContent).toLowerCase();
      return details;
    }

    function buildGroup(category, entries) {
      var section = document.createElement("section");
      section.className = "category-group";
      section.dataset.category = category.id;

      var heading = document.createElement("h2");
      heading.className = "category-heading";
      var dot = document.createElement("span");
      dot.className = "dot";
      heading.appendChild(dot);
      heading.appendChild(document.createTextNode(category.label));

      var list = document.createElement("div");
      list.className = "entry-list";
      entries.forEach(function (entry) { list.appendChild(buildEntry(entry)); });

      section.appendChild(heading);
      section.appendChild(list);
      return section;
    }

    function buildChips(categories) {
      categories.forEach(function (category) {
        var chip = document.createElement("button");
        chip.className = "chip";
        chip.type = "button";
        chip.dataset.category = category.id;
        chip.setAttribute("aria-pressed", "false");
        chip.textContent = category.label;
        chipRow.appendChild(chip);
      });
    }

    function clearMarks(el) {
      el.querySelectorAll("mark").forEach(function (m) {
        m.replaceWith(document.createTextNode(m.textContent));
      });
      el.normalize();
    }

    function highlight(el, query) {
      if (!query) return;
      var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
      var nodes = [];
      var node;
      while ((node = walker.nextNode())) nodes.push(node);
      nodes.forEach(function (textNode) {
        var text = textNode.textContent;
        var idx = text.toLowerCase().indexOf(query);
        if (idx === -1) return;
        var span = document.createElement("span");
        span.appendChild(document.createTextNode(text.slice(0, idx)));
        var mark = document.createElement("mark");
        mark.textContent = text.slice(idx, idx + query.length);
        span.appendChild(mark);
        span.appendChild(document.createTextNode(text.slice(idx + query.length)));
        textNode.replaceWith(span);
      });
    }

    function applyFilters() {
      var query = searchInput.value.trim().toLowerCase();
      var visibleCount = 0;

      groups.forEach(function (group) {
        var categoryMatches = activeCategory === "all" || group.dataset.category === activeCategory;
        var groupHasVisible = false;

        group.querySelectorAll(".entry").forEach(function (entry) {
          var qEl = entry.querySelector(".q-text");
          var aEl = entry.querySelector(".a-text");
          clearMarks(qEl);
          clearMarks(aEl);

          var textMatches = !query || (entry.dataset.searchText || "").indexOf(query) !== -1;
          var visible = categoryMatches && textMatches;

          entry.classList.toggle("is-hidden", !visible);

          if (visible) {
            groupHasVisible = true;
            visibleCount++;
            if (query) {
              highlight(qEl, query);
              highlight(aEl, query);
              entry.open = true;
            } else {
              entry.open = false;
            }
          }
        });

        group.classList.toggle("is-hidden", !groupHasVisible);
      });

      resultCount.textContent = query || activeCategory !== "all" ? "該当 " + visibleCount + " 件" : "全" + visibleCount + "件";
      emptyState.classList.toggle("is-visible", visibleCount === 0 && totalEntries > 0);
    }

    function bindControls() {
      chipRow.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          activeCategory = chip.dataset.category;
          chipRow.querySelectorAll(".chip").forEach(function (other) {
            other.setAttribute("aria-pressed", other === chip ? "true" : "false");
          });
          applyFilters();
        });
      });
      searchInput.addEventListener("input", applyFilters);
    }

    function render(data) {
      var categories = data.categories || [];
      var entries = data.entries || [];
      totalEntries = entries.length;

      buildChips(categories);

      // 1回のループでカテゴリごとにまとめ、組み立てた分をまとめて差し込む
      // （カテゴリごとにfilterすると走査がカテゴリ数×件数になり、挿入も回数分の再描画を招く）。
      var grouped = new Map();
      entries.forEach(function (entry) {
        if (!grouped.has(entry.category)) grouped.set(entry.category, []);
        grouped.get(entry.category).push(entry);
      });

      var fragment = document.createDocumentFragment();
      categories.forEach(function (category) {
        var groupEntries = grouped.get(category.id);
        if (!groupEntries) return;
        fragment.appendChild(buildGroup(category, groupEntries));
      });
      results.insertBefore(fragment, emptyState);

      groups = Array.prototype.slice.call(results.querySelectorAll(".category-group"));
      totalCount.textContent = String(totalEntries);
      lastUpdated.textContent = formatDate(data.updatedAt);

      if (data.formsUrl && data.formsUrl.indexOf("https://") === 0) {
        askLink.href = data.formsUrl;
        askLink.removeAttribute("aria-disabled");
        askLink.target = "_blank";
        askLink.rel = "noopener";
      }

      if (totalEntries === 0) {
        statusEl.textContent = "まだ公開中のQ&Aはありません。質問が届き次第、順次掲載します。";
        resultCount.textContent = "全0件";
      } else {
        // 描画後に失敗したときの表示先として残しておき、隠すだけにする。
        statusEl.hidden = true;
        applyFilters();
      }

      results.setAttribute("aria-busy", "false");
      bindControls();
    }

    function showError(error) {
      results.setAttribute("aria-busy", "false");
      statusEl.hidden = false;
      statusEl.textContent = "Q&Aを読み込めませんでした。時間をおいて再度お試しください。";
      resultCount.textContent = "";
      console.error(error);
    }

    fetch("data/faq.json", { cache: "no-cache" })
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(render)
      .catch(showError);
  })();
</script>
</body>
</html>
