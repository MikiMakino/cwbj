name: Build data

# data/curated.json や data/intake.json が変わったら、表示用の data/faq.json を作り直す。
# intakeリポジトリからのpushでもこのワークフローが走り、生成物のずれを防ぐ。

on:
  push:
    branches: [main]
    paths:
      - "data/curated.json"
      - "data/intake.json"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/build-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "config/**"
  workflow_dispatch:

concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: テスト
        run: node --test "tests/*.test.mjs"

      - name: data/faq.json を生成
        run: node scripts/build-data.mjs

      - name: プルリクエストでは差分がないことだけ確認する
        if: github.event_name == 'pull_request'
        run: node scripts/build-data.mjs --check

      - name: 変更があればコミットする
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain data/faq.json)" ]; then
            echo "data/faq.json に変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/faq.json
          git commit -m "chore: data/faq.json を再生成"
          git push
